name: Build Heavy Installer (Inno Setup)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download Llama Engine
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ggerganov/llama.cpp/releases/download/b4497/llama-b4497-bin-win-avx2-x64.zip" -OutFile "llama-win.zip"
          Expand-Archive -Path "llama-win.zip" -DestinationPath "bin-win"

      - name: Download Models
        shell: pwsh
        run: |
          echo "Downloading Model..."
          $modelUrl = "https://huggingface.co/bartowski/Qwen2-VL-2B-Instruct-GGUF/resolve/main/Qwen2-VL-2B-Instruct-Q4_K_M.gguf"
          Invoke-WebRequest -Uri $modelUrl -OutFile "bin-win/Qwen2-VL-2B-Instruct-Q4_K_M.gguf"
          
          echo "Downloading Projector..."
          $mmprojUrl = "https://huggingface.co/bartowski/Qwen2-VL-2B-Instruct-GGUF/resolve/main/mmproj-Qwen2-VL-2B-Instruct-f16.gguf"
          Invoke-WebRequest -Uri $mmprojUrl -OutFile "bin-win/mmproj-Qwen2-VL-2B-Instruct-f16.gguf"

      - name: Build JAR
        shell: pwsh
        run: |
          if (Test-Path "gradlew") { ./gradlew shadowJar --no-daemon } else { gradle shadowJar --no-daemon }

      - name: Prepare App Folder
        shell: pwsh
        run: |
          $jar = Get-ChildItem -Path . -Recurse -Filter "*.jar" | Where-Object { $_.FullName -like "*build\libs\*" } | Select-Object -First 1
          if ($null -eq $jar) { Write-Error "JAR not found"; exit 1 }
          
          $inputDir = $jar.DirectoryName
          
          jpackage --type app-image `
                   --input $inputDir `
                   --main-jar $jar.Name `
                   --name "Vision2XLS" `
                   --main-class app.view.SimpleUi `
                   --dest build/image `
                   --app-version "1.0.0" `
                   --vendor "Aurivena" `
                   --java-options "--enable-preview"

      - name: Inject Models
        shell: pwsh
        run: |
          $dest = "build/image/Vision2XLS/bin"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Path "bin-win/*" -Destination $dest -Recurse

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup

      - name: Compile Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output
          
          $issContent = @"
          [Setup]
          AppName=Vision2XLS
          AppVersion=1.0.0
          DefaultDirName={autopf}\Vision2XLS
          DefaultGroupName=Vision2XLS
          OutputDir=output
          OutputBaseFilename=Vision2XLS-Setup
          Compression=lzma2/fast
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          
          [Files]
          Source: "build\image\Vision2XLS\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          
          [Icons]
          Name: "{group}\Vision2XLS"; Filename: "{app}\Vision2XLS.exe"
          Name: "{commondesktop}\Vision2XLS"; Filename: "{app}\Vision2XLS.exe"
          
          [Run]
          Filename: "{app}\Vision2XLS.exe"; Description: "Launch Vision2XLS"; Flags: nowait postinstall skipifsilent
          "@
          
          Set-Content -Path "setup.iss" -Value $issContent
          
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Vision2XLS-Installer
          path: output/*.exe
          compression-level: 0