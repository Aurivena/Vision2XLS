name: Build Windows EXE (Gradle)

on:
  push:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./Vision2XLS

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download Llama Windows
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/ggerganov/llama.cpp/releases/download/b4497/llama-b4497-bin-win-avx2-x64.zip" -OutFile "../llama-win.zip"
          Expand-Archive -Path "../llama-win.zip" -DestinationPath "../bin-win"

      - name: Build with Gradle
        run: |
          # Даем права на выполнение (на всякий случай) и запускаем shadowJar
          ./gradlew shadowJar --no-daemon

      - name: Create EXE Bundle
        shell: pwsh
        run: |
          # Ищем JAR в папке build/libs
          $jar = Get-ChildItem build/libs/Vision2XLS.jar | Select-Object -First 1
          
          echo "Found Jar: $($jar.FullName)"
          
          jpackage --type app-image `
                   --input build/libs `
                   --main-jar $jar.Name `
                   --name "Vision2XLS" `
                   --main-class app.view.SimpleUi `
                   --dest output `
                   --java-options "--enable-preview" `
                   --win-console

      - name: Copy Llama to App
        shell: pwsh
        run: |
          $dest = "output/Vision2XLS/bin"
          New-Item -ItemType Directory -Force -Path $dest
          Copy-Item -Path "../bin-win/*" -Destination $dest -Recurse

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vision2XLS-Windows-Build
          path: Vision2XLS/output/Vision2XLS